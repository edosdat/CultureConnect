<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Filtres</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,700&amp;display=swap">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:#1A0B1E;color:#FFF1F4}
button{font-family:inherit;cursor:pointer}
a{color:#FF2E7E}a:hover{color:#FF6FA5}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D0510; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; color: #FFF1F4">
  <div role="dialog" aria-modal="true" aria-labelledby="f-title" style="position: absolute; left: 0; right: 0; bottom: 0; top: 40px; background: #2A1231; border-radius: 28px 28px 0 0; padding: 12px 16px 0 16px; display: flex; flex-direction: column; gap: 18px">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #6B3A72"></div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 id="f-title" style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 700">Affine ton plan</h1>
      <button type="button" onClick="{{reset}}" style="min-height: 44px; border: none; background: transparent; color: #FF2E7E; font-size: 14px; font-weight: 700">Tout effacer</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #D3B3CE">Quand</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{whens}}" as="c" hint-placeholder-count="5">
          <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="height: 40px; padding: 0 14px; border-radius: 20px; font-size: 14px; font-weight: 700; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}">{{c.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #D3B3CE">Quoi</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{whats}}" as="c" hint-placeholder-count="6">
          <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="height: 40px; padding: 0 14px; border-radius: 20px; font-size: 14px; font-weight: 700; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}">{{c.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #D3B3CE">Budget</div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; background: #3A1840; padding: 4px; border-radius: 14px">
        <sc-for list="{{budgets}}" as="c" hint-placeholder-count="4">
          <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="height: 40px; border-radius: 10px; border: none; font-size: 13px; font-weight: 700; background: {{c.bg}}; color: {{c.fg}}">{{c.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #D3B3CE">Où</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{wheres}}" as="c" hint-placeholder-count="4">
          <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="height: 40px; padding: 0 14px; border-radius: 20px; font-size: 14px; font-weight: 700; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}">{{c.label}}</button>
        </sc-for>
      </div>
    </div>

    <button type="button" onClick="{{togglePerso}}" aria-pressed="{{perso}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 0 14px; border-radius: 16px; border: 1px solid #4A2350; background: #1A0B1E; color: #FFF1F4; text-align: left">
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 700">Mon type d’abord</span>
        <span style="font-size: 12px; color: #D3B3CE">Ce qui te ressemble passe en premier</span>
      </span>
      <span aria-hidden="true" style="width: 48px; height: 28px; flex-shrink: 0; border-radius: 14px; background: {{switchBg}}; position: relative; display: block">
        <span style="position: absolute; top: 3px; left: {{knobLeft}}; width: 22px; height: 22px; border-radius: 11px; background: #FFF1F4; display: block"></span>
      </span>
    </button>

    <div style="margin-top: auto; padding: 12px 0 24px 0; border-top: 1px solid #4A2350; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 13px; color: #D3B3CE; text-align: center">{{summary}}</div>
      <a href="Recherche.dc.html" style="height: 54px; border-radius: 27px; background: #FF2E7E; color: #1A0B1E; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Voir les spectacles</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.init = { when: 'Cette semaine', whats: { 'Théâtre': true, 'Humour': true }, budget: 'Tout', where: 'Toute la métropole', perso: true };
    this.state = JSON.parse(JSON.stringify(this.init));
  }
  chip(label, on, pick) {
    return { label, on, pick, bg: on ? '#FF2E7E' : 'transparent', fg: on ? '#1A0B1E' : '#FFF1F4', border: on ? '#FF2E7E' : '#4A2350' };
  }
  renderVals() {
    const s = this.state;
    const whats = ['Théâtre', 'Humour', 'Concerts', 'Danse', 'Cirque', 'Jeune public'];
    const sel = whats.filter((w) => s.whats[w]);
    return {
      whens: ['Ce soir', 'Demain', 'Ce week-end', 'Cette semaine', 'Choisir une date'].map((l) => this.chip(l, s.when === l, () => this.setState({ when: l }))),
      whats: whats.map((l) => this.chip(l, Boolean(s.whats[l]), () => this.setState((st) => ({ whats: Object.assign({}, st.whats, { [l]: !st.whats[l] }) })))),
      budgets: ['Gratuit', '< 15 €', '< 30 €', 'Tout'].map((l) => {
        const on = s.budget === l;
        return { label: l, on, bg: on ? '#2A1231' : 'transparent', fg: on ? '#FF2E7E' : '#FFF1F4', pick: () => this.setState({ budget: l }) };
      }),
      wheres: ['Près de moi', 'Centre-ville', 'Toute la métropole'].map((l) => this.chip(l, s.where === l, () => this.setState({ where: l }))),
      perso: s.perso,
      togglePerso: () => this.setState({ perso: !s.perso }),
      switchBg: s.perso ? '#FF2E7E' : '#4A2350',
      knobLeft: s.perso ? '23px' : '3px',
      reset: () => this.setState(JSON.parse(JSON.stringify(this.init))),
      summary: [s.when, sel.length ? sel.join(', ') : 'Tout', s.budget === 'Tout' ? 'tous budgets' : s.budget, s.where].join(' · ')
    };
  }
}
</script>
</body>
</html>
