<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Première connexion — duels</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,700&amp;display=swap">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:#1A0B1E;color:#FFF1F4}
button{font-family:inherit;cursor:pointer}
a{color:#FF2E7E}a:hover{color:#FF6FA5}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1A0B1E; color: #FFF1F4; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif">

  <sc-if value="{{playing}}" hint-placeholder-val="{{ true }}">
    <div style="padding: 18px 16px 20px 16px; display: flex; flex-direction: column; gap: 10px; height: 844px; box-sizing: border-box">
      <div style="display: flex; align-items: center; justify-content: space-between; height: 32px">
        <span style="font-size: 14px; font-weight: 700; color: #D3B3CE">Duel {{step}} sur 3</span>
        <a href="W1_Bienvenue.dc.html" style="font-size: 14px; font-weight: 600; min-height: 32px; display: flex; align-items: center">Retour</a>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px">
        <sc-for list="{{segments}}" as="seg" hint-placeholder-count="3">
          <div style="height: 5px; border-radius: 3px; background: {{seg.color}}"></div>
        </sc-for>
      </div>
      <h1 style="margin: 4px 0 0 0; font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 700">Lequel te fait le plus d’effet&nbsp;?</h1>

      <div style="position: relative; display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{pair}}" as="c" hint-placeholder-count="2">
          <div style="position: relative; height: 298px; border-radius: 22px; overflow: hidden; box-shadow: 0 10px 26px rgba(0,0,0,0.45)">
            <button type="button" onClick="{{c.pick}}" aria-label="Choisir {{c.title}}" style="position: absolute; inset: 0; border: none; padding: 0; margin: 0; background: #2A1231; display: block; width: 100%; height: 100%; text-align: left; color: #FFF1F4">
              <img src="{{c.img}}" alt="Affiche de {{c.title}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block">
              <span style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 64px 14px 16px; background: rgba(26,11,30,0.92); display: flex; flex-direction: column; gap: 3px">
                <span style="font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: {{c.accent}}">{{c.cat}}</span>
                <span style="font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 700; line-height: 1.05">{{c.title}}</span>
                <span style="font-size: 13px; color: #D3B3CE">{{c.when}} · {{c.venue}}</span>
              </span>
            </button>
            <button type="button" onClick="{{c.more}}" aria-label="En savoir plus sur {{c.title}}" style="position: absolute; right: 12px; bottom: 18px; width: 44px; height: 44px; border-radius: 22px; border: 2px solid #FFF1F4; background: #FF2E7E; color: #1A0B1E; display: flex; align-items: center; justify-content: center">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
          </div>
        </sc-for>
        <div aria-hidden="true" style="position: absolute; left: 50%; top: 304px; transform: translate(-50%, -50%); width: 40px; height: 40px; border-radius: 20px; background: #1A0B1E; border: 2px solid #4A2350; display: flex; align-items: center; justify-content: center; font-family: Fraunces, Georgia, serif; font-size: 15px; font-weight: 700">ou</div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: auto">
        <button type="button" onClick="{{none}}" style="height: 44px; border-radius: 22px; border: 1px solid #4A2350; background: transparent; color: #FFF1F4; font-size: 14px; font-weight: 600">Aucun des deux</button>
        <button type="button" onClick="{{both}}" style="height: 44px; border-radius: 22px; border: 1px solid #4A2350; background: transparent; color: #FFF1F4; font-size: 14px; font-weight: 600">Les deux, gourmand·e</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <div style="padding: 60px 20px 32px 20px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
      <div style="font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #D3B3CE">3 duels plus tard</div>
      <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 38px; font-weight: 700; line-height: 1.05">On commence à te cerner.</h1>
      <p style="margin: 0; font-size: 15px; color: #D3B3CE">Tu as choisi :</p>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{chosen}}" as="k" hint-placeholder-count="3">
          <div style="height: 132px; border-radius: 14px; overflow: hidden; position: relative; background: #2A1231">
            <img src="{{k.img}}" alt="{{k.title}}" style="width: 100%; height: 100%; object-fit: cover; display: block">
          </div>
        </sc-for>
      </div>
      <a href="ProfilType.dc.html" style="margin-top: auto; height: 56px; border-radius: 28px; background: #FF2E7E; color: #1A0B1E; font-size: 17px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">C’est quoi mon type&nbsp;?</a>
      <button type="button" onClick="{{restart}}" style="min-height: 44px; border: none; background: transparent; color: #FF2E7E; font-size: 15px; font-weight: 600">Refaire les duels</button>
    </div>
  </sc-if>

  <sc-if value="{{hasDetail}}" hint-placeholder-val="{{ false }}">
    <div role="dialog" aria-modal="true" aria-label="Détail du spectacle" style="position: absolute; inset: 0; background: #1A0B1E; display: flex; flex-direction: column; overflow: hidden">
      <div style="position: relative; height: 290px; flex-shrink: 0">
        <img src="{{d.img}}" alt="Affiche de {{d.title}}" style="width: 100%; height: 100%; object-fit: cover; display: block">
        <button type="button" onClick="{{closeDetail}}" aria-label="Retour au duel" style="position: absolute; left: 14px; top: 14px; width: 44px; height: 44px; border-radius: 22px; border: none; background: rgba(26,11,30,0.85); color: #FFF1F4; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
        </button>
      </div>
      <div style="padding: 16px 16px 0 16px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: {{d.accent}}">{{d.cat}}</span>
          <span style="font-family: Fraunces, Georgia, serif; font-size: 28px; font-weight: 700; line-height: 1.05">{{d.title}}</span>
          <span style="font-size: 14px; color: #D3B3CE">{{d.when}} · {{d.venue}} · {{d.price}}</span>
        </div>
        <p style="margin: 0; font-size: 14px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden">{{d.pitch}}</p>
        <div style="display: flex; flex-direction: column; gap: 8px; background: #2A1231; border: 1px solid #4A2350; border-radius: 16px; padding: 12px 14px">
          <sc-for list="{{d.gauges}}" as="g" hint-placeholder-count="4">
            <div style="display: grid; grid-template-columns: 90px minmax(0, 1fr); align-items: center; gap: 10px">
              <span style="font-size: 13px; font-weight: 700">{{g.label}}</span>
              <div style="display: flex; gap: 5px">
                <sc-for list="{{g.dots}}" as="dot" hint-placeholder-count="5">
                  <span style="width: 22px; height: 8px; border-radius: 4px; background: {{dot.color}}; display: block"></span>
                </sc-for>
              </div>
            </div>
          </sc-for>
        </div>
        <div style="display: flex; gap: 6px; flex-wrap: wrap">
          <sc-for list="{{d.pour}}" as="p" hint-placeholder-count="2">
            <span style="font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: #FFD23F; color: #1A0B1E">{{p}}</span>
          </sc-for>
        </div>
      </div>
      <div style="margin-top: auto; padding: 12px 16px 22px 16px; border-top: 1px solid #4A2350; background: #2A1231; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button type="button" onClick="{{closeDetail}}" style="height: 50px; border-radius: 25px; border: 1px solid #4A2350; background: transparent; color: #FFF1F4; font-size: 15px; font-weight: 700">Retour au duel</button>
        <button type="button" onClick="{{d.pick}}" style="height: 50px; border-radius: 25px; border: none; background: #FF2E7E; color: #1A0B1E; font-size: 15px; font-weight: 700">Je choisis celui-là</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0, detail: null, chosen: [] };
    const S = (o) => o;
    this.duels = [
      [
        S({ img: '/_blob/1e703da754fd2de1871ec8a349cbc131', title: 'Toulouse j’adore !', cat: 'Comédie', accent: '#FF9E6D', when: 'Jeu 1 oct · 20:30', venue: 'La Comédie de Toulouse', price: 'Prix non communiqué', pitch: 'Un couple de jeunes Parisiens est nommé à Toulouse. Barbara, la Toulousaine type, doit leur trouver un appart « super bien placé » et en faire de vrais Toulousains.', g: [4, 1, 1, 3], pour: ['Entre potes', 'En couple'] }),
        S({ img: '/_blob/661562f1f8168b0944ee68b51bbb4370', title: 'Portrait de Rita', cat: 'Théâtre contemporain', accent: '#FF4D6D', when: 'Mer 30 sept · 20:00', venue: 'Théâtre Sorano', price: 'Prix non communiqué', pitch: 'Rita arrive en Belgique de Yaoundé. Femme d’affaires accomplie au Cameroun, elle devient en Europe la cible d’un homme violent. Un texte coup de poing de Laurène Marx.', g: [0, 5, 2, 2], pour: ['Seul·e', 'En couple'] })
      ],
      [
        S({ img: '/_blob/7e221e3fb2e599da71b7640736c19598', title: 'DJ Pone, 30 ans de platines', cat: 'Hip-hop · électro', accent: '#B98CFF', when: 'Jeu 1 oct · 19:30', venue: 'Le Rex', price: '26 €', pitch: 'Pas un best-of : un vrai live où Bass Culture croise d’autres chapitres de sa carrière. Invités : Svinkels, TTC, Triptik.', g: [1, 3, 0, 5], pour: ['Entre potes'] }),
        S({ img: '/_blob/e1946f1f9398d21102a6ddf8a69b09d6', title: 'Superpêche', cat: 'Musique improvisée', accent: '#5EEAD4', when: 'Jeu 1 oct · 19:00', venue: 'Théâtre du Pavé', price: 'Prix non communiqué', pitch: 'Saxophone baryton et violoncelle, en acoustique et sans filet : le duo improvise une musique sensible et inventive.', g: [0, 1, 4, 1], pour: ['Seul·e', 'En couple'] })
      ],
      [
        S({ img: '/_blob/acd7a464f66a6aca4588fd03f4ba73d5', title: 'Pierre-Emmanuel Barré', cat: 'Humour · grande salle', accent: '#FFD23F', when: 'Ven 2 oct · 20:00', venue: 'Halle aux Grains', price: 'Prix non communiqué', pitch: '« Come-back ». En 2031, Pierre-Emmanuel Barré est has-been. Pour revenir sur le devant de la scène, il crée un nouveau spectacle.', g: [5, 2, 0, 3], pour: ['Entre potes'] }),
        S({ img: '/_blob/367ee5682fd0d3ef0c52ee4acdd769cf', title: 'Naine Rouge', cat: 'Clown · petit lieu', accent: '#FF4D6D', when: 'Ven 2 oct · 20:30', venue: 'Espace Roguet', price: 'Gratuit', pitch: 'Une conférence théâtro-clownesque sur les exoplanètes, onirique et hilarante.', g: [4, 0, 4, 2], pour: ['En famille', 'Entre potes'] })
      ]
    ];
  }
  next(picked) {
    this.setState((s) => ({ i: s.i + 1, detail: null, chosen: s.chosen.concat(picked) }));
  }
  view(c, key) {
    const labels = ['Drôle', 'Intense', 'Poétique', 'Énergie'];
    return Object.assign({}, c, {
      pick: () => this.next([c]),
      more: () => this.setState({ detail: key }),
      gauges: c.g.map((v, n) => ({ label: labels[n], dots: [0, 1, 2, 3, 4].map((k) => ({ color: k < v ? c.accent : '#4A2350' })) }))
    });
  }
  renderVals() {
    const { i, detail, chosen } = this.state;
    const done = i >= this.duels.length;
    const pr = this.duels[Math.min(i, this.duels.length - 1)];
    const a = this.view(pr[0], 'a');
    const b = this.view(pr[1], 'b');
    return {
      playing: !done,
      done,
      step: Math.min(i + 1, this.duels.length),
      segments: this.duels.map((x, k) => ({ color: k < i ? '#FF2E7E' : (k === i ? '#FFF1F4' : '#4A2350') })),
      pair: [a, b],
      none: () => this.next([]),
      both: () => this.next([pr[0], pr[1]]),
      hasDetail: !done && detail !== null,
      d: detail === 'b' ? b : a,
      closeDetail: () => this.setState({ detail: null }),
      chosen: chosen.slice(0, 6),
      restart: () => this.setState({ i: 0, detail: null, chosen: [] })
    };
  }
}
</script>
</body>
</html>
