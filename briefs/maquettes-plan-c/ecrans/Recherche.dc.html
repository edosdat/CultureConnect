<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Recherche</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,700&amp;display=swap">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:#1A0B1E;color:#FFF1F4}
button,input{font-family:inherit}
button{cursor:pointer}
input::placeholder{color:#A98AA6}
a{color:#FF2E7E}a:hover{color:#FF6FA5}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1A0B1E; color: #FFF1F4; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif">
  <div style="padding: 20px 16px 96px 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="W2_Semaine.dc.html" aria-label="Retour à la semaine" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: #2A1231; color: #FFF1F4; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="11 6 5 12 11 18"></polyline></svg>
      </a>
      <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Chercher un spectacle, un artiste, un lieu</label>
      <div style="flex-grow: 1; height: 48px; border-radius: 24px; background: #2A1231; border: 2px solid #FF2E7E; display: flex; align-items: center; gap: 8px; padding: 0 14px; box-sizing: border-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF2E7E" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
        <input id="q" type="search" value="{{q}}" onChange="{{onQ}}" placeholder="Un titre, un artiste, « jazz ce soir »…" style="flex-grow: 1; min-width: 0; height: 44px; border: none; outline: none; background: transparent; color: #FFF1F4; font-size: 15px">
      </div>
    </div>

    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <sc-for list="{{presets}}" as="p" hint-placeholder-count="4">
        <button type="button" onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="height: 36px; padding: 0 14px; border-radius: 18px; font-size: 13px; font-weight: 700; border: 1px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}">{{p.label}}</button>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <sc-for list="{{understood}}" as="u" hint-placeholder-count="2">
          <span style="font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: #FFD23F; color: #1A0B1E">{{u}}</span>
        </sc-for>
      </div>
      <a href="Filtres.dc.html" style="flex-shrink: 0; height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #4A2350; color: #FFF1F4; font-size: 13px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="7" y1="12" x2="17" y2="12"></line><line x1="10" y1="18" x2="14" y2="18"></line></svg>
        Filtres
      </a>
    </div>

    <div style="font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #D3B3CE">{{countLabel}}</div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{results}}" as="r" hint-placeholder-count="4">
        <a href="W2_Fiche.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 16px; background: #2A1231; border: 1px solid #4A2350; text-decoration: none; color: #FFF1F4">
          <div style="width: 58px; height: 58px; flex-shrink: 0; border-radius: 12px; background: {{r.color}}; color: #1A0B1E; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1">
            <span style="font-size: 11px; font-weight: 700; text-transform: uppercase">{{r.day}}</span>
            <span style="font-family: Fraunces, Georgia, serif; font-size: 16px; font-weight: 700">{{r.time}}</span>
          </div>
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
            <span style="font-size: 13px; color: #D3B3CE; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.meta}}</span>
          </div>
        </a>
      </sc-for>
    </div>

    <sc-if value="{{hasArtist}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #D3B3CE">Artiste</div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 12px; border-radius: 16px; background: #2A1231; border: 1px solid #4A2350">
          <div style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: #B98CFF; color: #1A0B1E; font-family: Fraunces, Georgia, serif; font-weight: 700; display: flex; align-items: center; justify-content: center">{{artistInitial}}</div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 700">{{artistName}}</span>
            <span style="font-size: 13px; color: #D3B3CE">{{artistMeta}}</span>
          </div>
          <button type="button" onClick="{{follow}}" aria-pressed="{{following}}" style="height: 36px; padding: 0 14px; border-radius: 18px; font-size: 13px; font-weight: 700; border: 1px solid #FF2E7E; background: {{followBg}}; color: {{followFg}}">{{followLabel}}</button>
        </div>
      </div>
    </sc-if>
  </div>

  <nav aria-label="Navigation principale" style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #2A1231; border-top: 1px solid #4A2350; display: flex; justify-content: space-around; align-items: center; padding-bottom: 8px; box-sizing: border-box">
    <a href="W2_Swipe.dc.html" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 76px; min-height: 44px; justify-content: center; text-decoration: none; color: #D3B3CE; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"></rect><path d="M9 3.5 7 2M15 3.5 17 2"></path></svg>
      Mes plans
    </a>
    <a href="W2_Semaine.dc.html" aria-current="page" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 76px; min-height: 44px; justify-content: center; text-decoration: none; color: #FF2E7E; font-size: 12px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
      Chercher
    </a>
    <a href="W4_MaBande.dc.html" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 76px; min-height: 44px; justify-content: center; text-decoration: none; color: #D3B3CE; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M17 14c2.6 0 4.5 1.8 4.5 4.5"></path></svg>
      Ma bande<span style="position: absolute; top: -2px; right: 14px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #FF2E7E; color: #1A0B1E; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: 'humour ce week-end', following: false };
    this.data = {
      'humour ce week-end': {
        understood: ['Ce week-end', 'Humour'],
        results: [
          { day: 'Ven', time: '20:30', title: 'Naine Rouge', meta: 'Espace Roguet · Gratuit', color: '#FF9E6D' },
          { day: 'Ven', time: '20:30', title: 'Maudite Répétition', meta: 'Cabaret Le Kalinka · 25 €', color: '#FF2E7E' },
          { day: 'Sam', time: '18:45', title: 'Le Tour du monde en 80 jours', meta: 'Théâtre Les 3 T · 28 €', color: '#FF9E6D' },
          { day: 'Sam', time: '20:30', title: 'MARA MORENO', meta: 'La Comédie de Toulouse · stand-up', color: '#FF2E7E' }
        ],
        artist: { name: 'Mara Moreno', meta: 'Stand-up · 1 date à Toulouse' }
      },
      'jazz ce soir': {
        understood: ['Ce soir', 'Jazz'],
        results: [{ day: 'Mar', time: '21:00', title: 'Jam jazz manouche', meta: 'Maison Blanche · 5 € conseillés', color: '#5EEAD4' }],
        artist: null
      },
      'gratuit demain': {
        understood: ['Demain', 'Gratuit'],
        results: [{ day: 'Mer', time: '18:30', title: 'Présentation de saison 2026-2027', meta: 'Cabaret Le Kalinka · Gratuit', color: '#FFD23F' }],
        artist: null
      },
      'théâtre à moins de 15 €': {
        understood: ['Théâtre', 'Moins de 15 €'],
        results: [
          { day: 'Ven', time: '20:30', title: 'Naine Rouge', meta: 'Espace Roguet · Gratuit', color: '#FF9E6D' },
          { day: 'Ven', time: '20:30', title: 'TOM', meta: 'Le Grenier Théâtre · 14 € tarif réduit', color: '#FF4D6D' }
        ],
        artist: null
      }
    };
  }
  renderVals() {
    const { q, following } = this.state;
    const key = (q || '').trim().toLowerCase();
    const hit = this.data[key];
    const n = hit ? hit.results.length : 0;
    return {
      q,
      onQ: (e) => this.setState({ q: e.target.value }),
      presets: Object.keys(this.data).map((label) => {
        const on = label === key;
        return { label, on, bg: on ? '#FF2E7E' : '#2A1231', fg: on ? '#1A0B1E' : '#FFF1F4', border: on ? '#FF2E7E' : '#4A2350', pick: () => this.setState({ q: label }) };
      }),
      understood: hit ? hit.understood : [],
      countLabel: hit ? (n + (n > 1 ? ' spectacles' : ' spectacle')) : 'Tape une envie, on s’occupe du reste',
      results: hit ? hit.results : [],
      hasArtist: Boolean(hit && hit.artist),
      artistName: hit && hit.artist ? hit.artist.name : '',
      artistMeta: hit && hit.artist ? hit.artist.meta : '',
      artistInitial: hit && hit.artist ? hit.artist.name.charAt(0) : '',
      following,
      follow: () => this.setState({ following: !following }),
      followLabel: following ? 'Suivi·e' : 'Suivre',
      followBg: following ? '#FF2E7E' : 'transparent',
      followFg: following ? '#1A0B1E' : '#FF2E7E'
    };
  }
}
</script>
</body>
</html>
